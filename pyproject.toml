[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabletop-manual-retriever"
version = "0.1.0"
description = "LLM-powered retrieval from tabletop game manuals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
parse-manual = "tabletop_manual_retriever.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_manual_retriever"]

[tool.hatch.build.targets.wheel.force-include]
"src/tabletop_manual_retriever" = "tabletop_manual_retriever"

[tool.pytest.ini_options]
testpaths = ["tests"]
