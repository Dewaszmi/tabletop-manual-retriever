services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      UPLOADS_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/app/data/uploads:z
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  qdrant_data:
