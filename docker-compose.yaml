services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      UPLOADS_DIR: /app/data/uploads
      CHAT_DB_PATH: /app/data/chats.sqlite3
      QDRANT_URL: http://qdrant:6333
      RAG_TOP_K: 10
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${GEMINI_API_KEY}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
    volumes:
      - ./data:/app/data:z
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - app

  # Optional local LLM fallback. Set LLM_BASE_URL=http://ollama:11434/v1,
  # LLM_MODEL=<local model>, and LLM_API_KEY=ollama to use it.
  ollama:
    image: ollama/ollama:latest
    volumes:
      # mounts ${HOME}/.ollama so already download models are reused (no re-download)
      - ${HOME}/.ollama:/root/.ollama
    networks:
      - app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  qdrant_data:
