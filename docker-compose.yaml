services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      UPLOADS_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/uploads:/app/data/uploads:z
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
